
<div class="container">
    <div class="row">
        <div class="col-12 azul">

            <div class="card">
                <div class="card-body">

                    @if(!modoModal){
                        <h3>Cadastro de Turma</h3><br>
                    }
            @if(!modoModal){
                <div class="alinharADireita">
                    <a href="admin/professor/new" class="btn btn-primary" mdbRippled>
                        <i class="fas fa-plus fa-sm"></i> Novo
                    </a>
                </div>
            }




            <h1>Professores</h1><br>
           
                            
                <table class="table">
                    
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">NOME</th>
                        <th scope="col">CPF</th>
                        <th scope="col">EMAIL</th>
                        <th scope="col">ESPECIALIDADE</th>
                    </tr>
                    </thead>
                    <tbody>
                        @for (professor of lista; track $index) {
                        <tr>
                            <td>{{professor.id}}</td>
                            <td>{{professor.nomeProfessor}}</td>
                            <td>{{professor.cpf}}</td>
                            <td>{{professor.email}}</td>
                            <td>{{professor.especialidade}}</td>
                            <td class="alinhar">
                              

                                @if(!modoModal){
                                    <a href="admin/professor/edit/{{professor.id}}" class="btn btn-primary btn-rounded"
                                        mdbRippled>
                                        <i class="fas fa-pencil fa-sm"></i>
                                    </a>
                                    <button (click)="delete(professor)" class="btn btn-danger btn-rounded" mdbRippled>
                                        <i class="fas fa-trash fa-sm"></i>
                                    </button>
                                }@else{
                                    <button (click)="selecionar(professor)" class="btn btn-success btn-rounded" mdbRippled>
                                       Selecionar
                                    </button>
                                }
                            </td>
                        </tr>
                    }
                   
                    </tbody>
                </table>

            </div>
        </div>

        </div>
    </div>
</div>
