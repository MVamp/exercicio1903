
<div class="container">
    <div class="row">
      <div class="col-4"></div>
  
      <div class="col-4">
        <div class="card">
          <div class="card-body centralizar">
            <h2>Cadastro de Turmas</h2>
  
  
            <form #formulario="ngForm">
  
              Nome do Turma:<br>
            <input  required [(ngModel)]="turma.nomeTurma" type="text" class="form-control" name="nome">
              <br>
            Semestre:<br>
            <input   [(ngModel)]="turma.semestre" type="text" class="form-control" name="semestre">
              
              <br />
              Ano:<br>
            <input   [(ngModel)]="turma.ano" type="text" class="form-control" name="ano">
              
              <br />
              Turno:<br>
            <input   [(ngModel)]="turma.turno" type="text" class="form-control" name="turno">
              
              <br />
              <button (click)="save()"  [disabled]="!formulario.valid" class="btn btn-success">Salvar</button>
              
              
                <button (click)="buscarProfessor()" class="btn btn-secondary" type="button" mdbRipple
                  rippleColor="danger">
                  Buscar professor
                </button>


                <table border="1" class="table table-striped">
                  <thead>

                    <tr>
                      <th>Lista de professores</th>
                    </tr>
                  </thead>
                  <tbody>
                    @for (professor of turma.professores; track $index) {
                    <tr>
                      <td>{{professor.nomeProfessor}}</td>
                    </tr>
                    <button (click)="deletarProfessor(professor)" class="btn btn-danger">Deletar</button>
                  }
                  
                  </tbody>
                </table>


                <div class="input-group mb-3">
                  @if(turma.curso){
                  <div class="border w-100 p-2 text-primary">{{turma.curso.nomeCurso}}</div>
                  <button (click)="buscarCurso()" class="btn btn-secondary" type="button" mdbRipple
                    rippleColor="danger">
                    Trocar curso
                  </button>
                  }@else{
                  <div class="border w-100 p-2">Nenhuma turma selecionada!</div>
                  <button (click)="buscarCurso()" class="btn btn-secondary" type="button" mdbRipple
                    rippleColor="danger">
                    Buscar curso
                  </button>
                  }
                </div>
    

            </form>
  
          </div>
        </div>
      </div>
  
      <div class="col-4"></div>
    </div>
  </div>



  <ng-template #modalProfessorList>
  
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Listagem de Professores</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.close()"></button>
    </div>
    <div class="modal-body">
  
      <app-professor-list [modoModal]="true" (meuEvento)="meuEventoTratamento($event)"></app-professor-list>
  
    </div>
  
  </ng-template>


  <ng-template #modalCursoList>
  
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Listagem de Curso</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.close()"></button>
    </div>
    <div class="modal-body">
  
      <app-curso-list [modoModal]="true" (meuEvento)="meuEventoTratamento2($event)"></app-curso-list>
  
    </div>
  
  </ng-template>
